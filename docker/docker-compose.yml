# docker-compose — full local stack
# Usage: docker-compose -f docker/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnwatch
      POSTGRES_PASSWORD: vulnwatch
      POSTGRES_DB: vulnwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://vulnwatch:vulnwatch@postgres:5432/vulnwatch
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/chroma-data
      - reports-data:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  chroma-data:
  reports-data: