apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnwatch-backend
  namespace: vulnwatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnwatch-backend
  template:
    metadata:
      labels:
        app: vulnwatch-backend
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB/vulnwatch-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vulnwatch-secrets
                  key: database-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vulnwatch-secrets
                  key: openai-api-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vulnwatch-secrets
                  key: secret-key
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
---
apiVersion: v1
kind: Service
metadata:
  name: vulnwatch-backend
  namespace: vulnwatch
spec:
  selector:
    app: vulnwatch-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP