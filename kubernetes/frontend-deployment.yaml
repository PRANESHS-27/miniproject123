apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnwatch-frontend
  namespace: vulnwatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnwatch-frontend
  template:
    metadata:
      labels:
        app: vulnwatch-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB/vulnwatch-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: vulnwatch-frontend
  namespace: vulnwatch
spec:
  selector:
    app: vulnwatch-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP