apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnwatch
  namespace: vulnwatch
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [vulnwatch.example.com]
      secretName: vulnwatch-tls
  rules:
    - host: vulnwatch.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vulnwatch-backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnwatch-frontend
                port: { number: 80 }